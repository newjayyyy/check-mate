spring:
  jackson:
    time-zone: Asia/Seoul

  datasource:
    url: jdbc:mysql://${MYSQL_ENDPOINT}:3306/checkmate?useSSL=true&serverTimezone=Asia/Seoul
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_ROOT_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        #show_sql: true
        format_sql: true
    defer-datasource-initialization: true

  sql:
    init:
      mode: never

  session:
    store-type: jdbc
    jdbc.initialize-schema: always
    timeout: 1h

  security:
    rememberme:
      key: ${REMEMBER_ME_KEY}

  servlet:
    multipart:
      max-file-size: 10MB # 업로드 파일 크기 제한

cloud:
  aws:
    s3:
      bucket: deepcheck-image-storage
    stack.auto: false
    region.static: ap-northeast-2
    credentials:
      access-key: ${AWS_ACCESS_KEY_ID}
      secret-key: ${AWS_SECRET_ACCESS_KEY}

# FastApi 모델 서버 기본 URL
model.server.url: ${MODEL_SERVER_URL}
# Frontend 배포 서버 URL
app.cors.allowed-origins: ${FRONTEND_URL}

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace
    org.springframework.security: debug
    org.springframework.security.authentication: debug
    org.springframework.security.web.authentication: debug
